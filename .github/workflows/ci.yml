name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory -d inventory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://inventory:inventory@localhost:5432/inventory?schema=public
      REDIS_DISABLED: "true"
      JWT_ACCESS_SECRET: ci-test-secret-at-least-32-characters!!
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @inventory/shared build
      - run: pnpm --filter @inventory/database generate
      - run: pnpm --filter @inventory/database exec prisma validate
      - run: pnpm --filter @inventory/database migrate:deploy
      - run: pnpm --filter @inventory/database seed
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:db
      - run: pnpm build
